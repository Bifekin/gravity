<html>
<head>
  <meta charset="UTF-8">
  <script language="javascript" type="text/javascript" src="libs/p5.js"></script>

  <link rel="stylesheet" type="text/css" href="css/styles.css" />
  <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css" />
  <script type="text/javascript" src="libs/jquery-1.12.4.min.js"></script>
  <script type="text/javascript" src="libs/bootstrap.min.js"></script>

  <script language="javascript" type="text/javascript" src="Sun.js"></script>
  <script language="javascript" type="text/javascript" src="Planet.js"></script>
  <script language="javascript" type="text/javascript" src="Shooter.js"></script>
  <script language="javascript" type="text/javascript" src="ParticleSystem.js"></script>
  <script language="javascript" type="text/javascript" src="main.js"></script>
</head>

<body>
  <!-- 在 body 内部创建一个上下文菜单的容器 -->
	<div id="context-menu">
    <div class="menu-item" id="pause" onclick="Pause()">暂停</div>
    <!-- 菜单项：行星列表，包含一个动态生成的二级菜单 -->
    <div class="menu-item" id="listAllPlanets" onmouseenter="delayedShowSubMenu(this)" onmouseleave="delayedHideSubMenu()">
      行星列表
      <ul class="sub-menu" id="planetSubMenu" onmouseenter="" onmouseleave="">
        <!-- 二级菜单项将在此动态添加 -->
      </ul>
    </div>
    
    <!-- 其他一级菜单项 -->
    <div class="menu-item" onclick="emptyTrack()">清空轨迹</div>
    <div class="menu-item" onclick="editShowPlanetSun()">编辑</div>
    <div class="menu-item" onclick="resetPlanet()">位置重置</div>
    <div class="menu-item" onclick="updatePlanet()">位置更新</div>
    <div class="menu-item" onclick="deletePlanetSun(event)">删除</div>
  </div>

  <!-- 显示操作提示 -->
  <div id="notification" class="hidden"></div>

  <!-- 选择加载的模型文件 -->
	<input type="file" id="fileInput" style="display: none;">

	<script>
    // 显示上下文菜单
    function showContextMenu(event) {
      event.preventDefault();
      const contextMenu = document.getElementById("context-menu");
      contextMenu.style.left = event.pageX + "px";
      contextMenu.style.top = event.pageY + "px";
      contextMenu.style.display = "block";

      // 动态生成“行星列表”二级菜单项
      const planetSubMenu = document.getElementById("planetSubMenu");
      // 添加动态生成的二级菜单项
      updateSubMenu(event);
    }
    // 隐藏上下文菜单
    function hideContextMenu() {
      const contextMenu = document.getElementById("context-menu");
      if (!contextMenu.preventHide) {
        contextMenu.style.display = "none";
      }
      contextMenu.preventHide = false;
    }

    let delayShowTimer, delayHideTimer; // 用于延时显示的定时器
    // 显示二级菜单（带延迟）
    function delayedShowSubMenu(element) {
      clearTimeout(delayHideTimer); // 清除延时隐藏定时器
      delayShowTimer = setTimeout(function() {
        showSubMenu(element);
      }, 200); // ms
    }
    // 显示二级菜单
    function showSubMenu(element) {
      const planetSubMenu = document.getElementById("planetSubMenu");
      planetSubMenu.style.display = "block";
    }
    // 隐藏二级菜单（带延迟）
    function delayedHideSubMenu(element) {
      clearTimeout(delayShowTimer); // 清除延时定时器
      delayHideTimer = setTimeout(function() {
      hideSubMenu();
      }, 500); 
    }
    // 隐藏二级菜单
    function hideSubMenu() {
      const planetSubMenu = document.getElementById("planetSubMenu");
      planetSubMenu.style.display = "none";
    }


    // 添加事件监听器，使上下文菜单在右击页面时显示，并在点击页面其他地方时隐藏
    document.addEventListener("contextmenu", showContextMenu);
    document.addEventListener("click", hideContextMenu);
    // 在一级菜单点击时阻止事件冒泡
    document.getElementById("context-menu").addEventListener("click", function (event) {
      event.stopPropagation();
    });
    
  </script>



	<!-- <button id="edit" data-toggle="modal" data-target="#myModal">编辑</button> -->
	<!-- Modal -->
	<div  class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
	<div class="modal-dialog" role="document">
		<div style="background-color: #33000000" class="modal-content">
		<div class="modal-header">
			<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
			<h4 style="color: #00ddff" class="modal-title" id="myModalLabel">编辑参数</h4>
		</div>
		<div class="modal-body" style="background-color: #33333333">
			<textarea id="simData" style="background-color: #33333333;color: #ffffff;"  class="form-control" rows="20"></textarea>
		</div>
		<div class="modal-footer">
			<button style="color: #00ddff;background-color: #ffffff" type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
			<button onclick="editPlanetSun()" style="background-color: #00ddff" type="button" class="btn btn-primary" data-dismiss="modal">保存参数</button>
		</div>
		</div>
	</div>
	</div>
</body>
</html>
