<html>
<head>
  <meta charset="UTF-8">
  <script language="javascript" type="text/javascript" src="libraries/p5.js"></script>

  <link rel="stylesheet" type="text/css" href="css/styles.css" />
  <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css" />
  <script type="text/javascript" src="libs/jquery-1.12.4.min.js"></script>
  <script type="text/javascript" src="libs/bootstrap.min.js"></script>

  <script language="javascript" type="text/javascript" src="Sun.js"></script>
  <script language="javascript" type="text/javascript" src="Planet.js"></script>
  <script language="javascript" type="text/javascript" src="Shooter.js"></script>
  <script language="javascript" type="text/javascript" src="simulation.js"></script>
  <style>
    body {
      padding: 0;
      margin: 0;
    }

  </style>
</head>

<body>
  <!-- 在 body 内部创建一个上下文菜单的容器 -->
	<div id="context-menu">
		<div class="menu-item" id="pause" onclick="Pause()">继续</div>
    <div class="menu-item" onclick="emptyTrack()">清空轨迹</div>
		<div class="menu-item" onclick="editShowPlanetSun()">编辑</div>
		<div class="menu-item" onclick="deletePlanetSun()">删除</div>
	</div>

	<!-- 你的页面内容 -->

	<script>
		function showContextMenu(event) {
			event.preventDefault();
			const contextMenu = document.getElementById("context-menu");
			contextMenu.style.left = event.pageX + "px";
			contextMenu.style.top = event.pageY + "px";
			contextMenu.style.display = "block";
		}

		function hideContextMenu() {
			const contextMenu = document.getElementById("context-menu");
			contextMenu.style.display = "none";
		}

		document.addEventListener("contextmenu", showContextMenu);
		document.addEventListener("click", hideContextMenu);
	</script>



	<!-- <button id="edit" data-toggle="modal" data-target="#myModal">编辑</button> -->
	<!-- Modal -->
	<div  class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
	<div class="modal-dialog" role="document">
		<div style="background-color: #33000000" class="modal-content">
		<div class="modal-header">
			<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
			<h4 style="color: #00ddff" class="modal-title" id="myModalLabel">编辑参数</h4>
		</div>
		<div class="modal-body" style="background-color: #33333333">
			<textarea id="simData" style="background-color: #33333333;color: #ffffff;"  class="form-control" rows="20"></textarea>
		</div>
		<div class="modal-footer">
			<button style="color: #00ddff;background-color: #ffffff" type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
			<button onclick="editPlanetSun()" style="background-color: #00ddff" type="button" class="btn btn-primary" data-dismiss="modal">保存参数</button>
		</div>
		</div>
	</div>
	</div>
</body>
</html>
